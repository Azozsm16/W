[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebabf"
version = "0.1.0"
description = "Evidence-Based Adaptive Behavioral Firewall - Linux host agent"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "cryptography>=41.0",
    "scapy>=2.5",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
ebabf-killswitch = "ebabf.engine.killswitch:main"
ebabf-agent = "ebabf.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ebabf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `from tests.conftest import ...` resolves under a bare `pytest` too,
# not only under `python -m pytest` (which puts cwd on sys.path itself).
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/ebabf"]
